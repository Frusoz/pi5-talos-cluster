---
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # The provisioner and its helper pod mount a hostPath volume. Talos enforces the
    # `baseline` Pod Security Standard, and `baseline` forbids hostPath. This namespace
    # needs the `privileged` level.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
