---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 30m
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.38"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: local-path-storage
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/data-volume
    storageClass:
      create: true
      name: local-path
      defaultClass: true
      defaultVolumeType: hostPath
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
    #tolerations:
    #  - key: node-role.kubernetes.io/control-plane
    #    operator: Exists
    #    effect: NoSchedule
    #configmap:
    #  helperPod:
    #    tolerations:
    #      - key: node-role.kubernetes.io/control-plane
    #        operator: Exists
    #        effect: NoSchedule
    #nodeSelector:
    #  kubernetes.io/arch: arm64
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
