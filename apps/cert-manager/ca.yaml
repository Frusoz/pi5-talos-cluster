---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-lan-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: home.lan Root CA
  secretName: home-lan-ca
  # Ten years
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
    # A new key on each renewal. The old certificate stays valid until it expires.
    rotationPolicy: Always
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-lan-ca
spec:
  ca:
    secretName: home-lan-ca
