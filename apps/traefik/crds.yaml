---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik-crds
      version: "1.18.0"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    gatewayAPI: true
    traefik: false
    deleteOnUninstall: true
