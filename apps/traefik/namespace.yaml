---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    # Traefik binds port 80 and port 443 on the node with `hostPort`. Talos enforces the
    # `baseline` Pod Security Standard, and `baseline` forbids hostPort. This namespace
    # needs the `privileged` level.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
