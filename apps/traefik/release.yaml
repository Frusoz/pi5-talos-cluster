---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "42.2.0"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    ingressClass:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: traefik-gateway
      listeners:
        # The chart declares a `web` listener on port 8000. This Gateway serves HTTPS
        # only, so `null` drops it.
        web: null
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: home-lan-tls
    ports:
      # The chart declares a `web` port on 8000. The matching listener is gone, and a
      # port with no listener fails the template, so `null` drops it too.
      web: null
      websecure:
        port: 8443
        hostPort: 443
    service:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
